services:
  inventory-manager:
    build: .
    container_name: inventory-manager
    ports:
      - "1975:1975"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATA_DIR=/data
      - PHOTO_DIR=/photos
      - BACKUP_DIR=/backups
      - SHARED_UPDATER_URL=${SHARED_UPDATER_URL:-http://host.docker.internal:8093/apps/inventory-manager}
      - MAX_SINGLE_UPLOAD_GB=${MAX_SINGLE_UPLOAD_GB:-8}
      - PHOTO_WORKER_POLL_SECONDS=${PHOTO_WORKER_POLL_SECONDS:-2}
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_POST_LOGOUT_REDIRECT_URI=${OIDC_POST_LOGOUT_REDIRECT_URI:-}
      - OIDC_ACCOUNT_URL=${OIDC_ACCOUNT_URL:-}
      - OIDC_AUTO_PROVISION=${OIDC_AUTO_PROVISION:-true}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      - ${HOST_PROJECT_DIR:-.}/data:/data
      - ${HOST_PROJECT_DIR:-.}/photos:/photos
      - ${HOST_PROJECT_DIR:-.}/backups:/backups
    restart: unless-stopped
